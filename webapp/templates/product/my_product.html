{% extends "base.html"%}

{% block content %}
<a href="{{ url_for('product.add_product') }}" class="btn btn-primary mb-3">
    Добавить товар
</a>
<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-3">
        <a href="{{ url_for('product.product_page', product_id=product.id) }}" class="text-decoration-none text-dark">
            <div class="card">
                <div class="card-body">
                    <h5>{{ product.title }}</h5>
                    <p>Цена: {{ product.price }} ₽</p>
                    <p>Размер: {{ product.size }} </p>
                    <p class="text-muted">Город: {{ product.city }}</p>
                </div>
            </div>
        </a>
    </div>
    {% else %}
    <p>У Вас добавленных товаров пока нет</p>
    {% endfor %}
</div>
{% endblock %}
